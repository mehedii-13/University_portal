<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>University Portal — Sign In</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="login-wrapper">
        <div class="login-card">
            <div class="login-header">
                <h1>University Portal</h1>
                <p>Sign in with your account</p>
            </div>

            <div id="loginError" class="error-banner"></div>

            <form id="loginForm">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" class="form-control" required autocomplete="username" placeholder="Enter username">
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" class="form-control" required autocomplete="current-password" placeholder="Enter password">
                </div>

                <button type="submit" class="btn btn-primary" id="loginBtn" style="width: 100%; margin-top: 6px;">
                    <span id="loginBtnText">Sign In</span>
                </button>
            </form>

            <div class="demo-box">
                <div class="demo-title">Quick Demo Login</div>
                <div class="demo-buttons">
                    <button type="button" class="demo-btn" onclick="fillDemoSession('admin', 'admin123')">
                        <span><strong>Admin:</strong> Arthur Pendelton</span>
                        <code>admin</code>
                    </button>
                    <button type="button" class="demo-btn" onclick="fillDemoSession('prof.miller', 'miller123')">
                        <span><strong>Teacher:</strong> Prof. Robert Miller</span>
                        <code>prof.miller</code>
                    </button>
                    <button type="button" class="demo-btn" onclick="fillDemoSession('alice.w', 'alice123')">
                        <span><strong>Student:</strong> Alice Walker</span>
                        <code>alice.w</code>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="/js/auth.js"></script>
</body>
</html>
